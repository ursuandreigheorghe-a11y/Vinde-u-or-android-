
name: Build Vinde Usor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -o Vinde_Usor_AI_actualizat.zip -d project
          echo "Proiect extras."
          find project -name build.gradle -type f

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure AndroidX
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | grep -v '/app/' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "EROARE: Nu gasesc build.gradle principal."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | grep -v '/app/' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "EROARE: Nu gasesc build.gradle principal."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"

          echo "Construiesc APK..."
          gradle assembleDebug

          echo "Verific semnatura..."
          gradle signingReport

          echo "APK construit cu succes."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinde-Usor-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
