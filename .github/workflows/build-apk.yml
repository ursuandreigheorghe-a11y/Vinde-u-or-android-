
name: Build Vinde Usor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl python3

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -o Vinde_Usor_AI_actualizat.zip -d project
          find project -name build.gradle -type f

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Enable AndroidX
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | grep -v '/app/' | head -n 1)
          test -n "$BUILD_FILE"
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | grep -v '/app/' | head -n 1)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle assembleDebug
          gradle signingReport

      - name: Verify Firebase Google Client ID
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("project")

          json_files = list(root.rglob("google-services.json"))
          xml_files = list(root.rglob(
              "build/generated/res/google-services/debug/values/values.xml"
          ))

          if not json_files:
              raise SystemExit("EROARE: google-services.json lipseste.")

          if not xml_files:
              raise SystemExit("EROARE: values.xml nu a fost generat.")

          config = None

          for file in json_files:
              data = json.loads(file.read_text(encoding="utf-8"))
              for client in data.get("client", []):
                  package = client.get("client_info", {}).get(
                      "android_client_info", {}
                  ).get("package_name")

                  if package == "com.vindeusor.app":
                      config = client
                      break
              if config:
                  break

          if not config:
              raise SystemExit("EROARE: aplicatia Android nu exista in JSON.")

          web_ids = set()

          for oauth in config.get("oauth_client", []):
              if str(oauth.get("client_type")) == "3":
                  web_ids.add(oauth.get("client_id"))

          web_ids.discard(None)

          if not web_ids:
              raise SystemExit("EROARE: client OAuth Web lipseste.")

          found = False

          for file in xml_files:
              tree = ET.parse(file)
              for item in tree.getroot().findall("string"):
                  if item.attrib.get("name") == "default_web_client_id":
                      found = True
                      generated_id = item.text

                      if generated_id in web_ids:
                          print("SUCCES: default_web_client_id este corect.")
                          break
                      else:
                          raise SystemExit(
                              "EROARE: ID-ul generat nu corespunde clientului Web."
                          )

          if not found:
              raise SystemExit("EROARE: default_web_client_id nu a fost generat.")

          print("SUCCES: configuratia Firebase Google este verificata.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinde-Usor-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
