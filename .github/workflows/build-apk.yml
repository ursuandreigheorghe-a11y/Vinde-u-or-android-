
name: Build Vinde Usor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl python3

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -o Vinde_Usor_AI_actualizat.zip -d project
          echo "CONTINUT PROIECT:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure AndroidX
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | grep -v '/app/' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "EROARE: Nu gasesc build.gradle principal."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          BUILD_FILE=$(find project -name build.gradle -type f | grep -v '/app/' | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "EROARE: Nu gasesc build.gradle principal."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"

          echo "Construiesc APK..."
          gradle assembleDebug

          echo "Verific semnatura..."
          gradle signingReport

      - name: Verify Firebase Google Client ID
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("project")

          print("1. Caut google-services.json...")

          json_files = list(root.rglob("google-services.json"))

          if not json_files:
              raise SystemExit("EROARE: google-services.json lipseste.")

          config = None

          for file in json_files:
              print("Fisier gasit:", file)

              data = json.loads(file.read_text(encoding="utf-8"))

              for client in data.get("client", []):
                  package = client.get("client_info", {}).get(
                      "android_client_info", {}
                  ).get("package_name")

                  if package == "com.vindeusor.app":
                      config = client
                      break

              if config:
                  break

          if not config:
              raise SystemExit(
                  "EROARE: Aplicatia com.vindeusor.app nu exista in JSON."
              )

          print("2. Aplicatia Android a fost gasita.")

          web_ids = {
              item.get("client_id")
              for item in config.get("oauth_client", [])
              if str(item.get("client_type")) == "3"
              and item.get("client_id")
          }

          if not web_ids:
              raise SystemExit(
                  "EROARE: Clientul OAuth Web lipseste din JSON."
              )

          print("3. Client OAuth Web gasit.")

          print("4. Caut values.xml generat de Google Services...")

          xml_files = list(root.rglob(
              "build/generated/res/processDebugGoogleServices/values/values.xml"
          ))

          if not xml_files:
              raise SystemExit(
                  "EROARE: Nu gasesc values.xml generat de Google Services."
              )

          found = False

          for file in xml_files:
              print("Verific fisierul:", file)

              tree = ET.parse(file)

              for item in tree.getroot().findall("string"):
                  if item.attrib.get("name") == "default_web_client_id":
                      generated_id = (item.text or "").strip()

                      if generated_id not in web_ids:
                          raise SystemExit(
                              "EROARE: ID-ul generat nu corespunde clientului OAuth Web."
                          )

                      found = True
                      break

              if found:
                  break

          if not found:
              raise SystemExit(
                  "EROARE: default_web_client_id lipseste din values.xml."
              )

          print("SUCCES: Configuratia Firebase Google este verificata.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinde-Usor-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
