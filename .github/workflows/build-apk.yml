
name: Build Vinde Usor APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ls -la
          test -f vinde_usor_android_cloud_build.zip

      - name: Unpack project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir project
          unzip -o vinde_usor_android_cloud_build.zip -d project
          find project -maxdepth 3 -name gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

          - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses
    

      - name: Build APK
        run: |
          cd project
          if [ ! -f gradlew ]; then
            DIR=$(find . -name gradlew -type f | head -n 1)
            test -n "$DIR"
            cd "$(dirname "$DIR")"
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinde-Usor-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
